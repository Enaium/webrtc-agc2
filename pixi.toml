[workspace]
authors = ["Enaium <enaium@outlook.com>"]
channels = ["conda-forge"]
name = "agc2"
platforms = ["osx-arm64", "win-64", "linux-64"]
version = "0.1.0"

[dependencies]
cmake = ">=4.4.2,<5"

[feature.build.dependencies]
ninja = ">=1.13.2,<2"

[feature.build.tasks.configure]
cmd = [
    "cmake",
    "-GNinja",
    "-S.",
    "-B.build",
]
inputs = ["CMakeLists.txt"]
outputs = [".build/CMakeFiles/"]

[feature.build.tasks.build]
cmd = ["cmake", "--build", ".build"]
depends-on = ["configure"]
inputs = ["CMakeLists.txt", "src/*"]
outputs = [
    ".build/*.dylib",
    ".build/*.dll",
    ".build/*.so",
]

[feature.build.tasks.configure-test]
cmd = [
    "cmake",
    "-GNinja",
    "-S.",
    "-B.build-tests",
    "-DBUILD_TESTS=ON",
]
inputs = ["CMakeLists.txt"]
outputs = [".build-tests/CMakeFiles/"]

[feature.build.tasks.build-test]
cmd = ["cmake", "--build", ".build-tests"]
depends-on = ["configure-test"]
inputs = ["CMakeLists.txt", "src/*", "tests/*"]
outputs = [".build-tests/agc2_test"]

[feature.build.tasks.run-test]
cmd = ".build-tests/agc2_test"
depends-on = ["build-test"]

# Emscripten is not provided by pixi: conda-forge's emscripten package ships an
# incompatible binaryen version. Activate an emsdk installation (so that
# `emcc`/`emcmake` are on PATH) before running the wasm tasks.
[feature.wasm.dependencies]
nodejs = ">=22,<27"

[feature.wasm.tasks.configure-wasm]
cmd = [
    "emcmake",
    "cmake",
    "-GNinja",
    "-S.",
    "-B.build-wasm",
    "-DCMAKE_BUILD_TYPE=Release",
]
inputs = ["CMakeLists.txt"]
outputs = [".build-wasm/CMakeFiles/"]

[feature.wasm.tasks.build-wasm]
cmd = ["cmake", "--build", ".build-wasm"]
depends-on = ["configure-wasm"]
inputs = ["CMakeLists.txt", "src/*", "wasm/*"]
outputs = [
    ".build-wasm/agc2_wasm.mjs",
    ".build-wasm/agc2_wasm.wasm",
]

[feature.wasm.tasks.run-test-wasm]
cmd = ["node", "tests/agc2_wasm_test.mjs"]
depends-on = ["build-wasm"]

[feature.wasm.tasks.pack-npm]
cmd = ["node", "npm/stage.mjs"]
depends-on = ["build-wasm"]
inputs = ["npm/*", "wasm/agc2.mjs", "LICENSE"]
outputs = [".build-npm/package.json"]

[feature.wasm.tasks.run-test-npm]
cmd = ["node", "npm/package-test.mjs"]
depends-on = ["pack-npm"]

[feature.wasm.tasks.publish-npm]
cmd = ["node", "npm/publish.mjs"]
depends-on = ["pack-npm"]

[environments]
build = ["build"]
wasm = ["wasm"]